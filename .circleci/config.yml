version: 2.1

orbs:
  # Snyk-owned orbs: track the latest release of the major version
  prodsec: snyk/prodsec-orb@1
  # Third-party orbs: always pin an exact version
  node: circleci/node@7.2.1

jobs:
  release:
    executor:
      name: node/default
      tag: '22'
    steps:
      - checkout
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25.0.3

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners

      - release:
          name: Release
          context:
            - nodejs-install
            - github-release
          requires:
            - Scan repository for secrets
          filters:
            branches:
              only:
                - master
